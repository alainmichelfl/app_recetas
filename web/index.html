<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Jitomate y Cebolla 🍅🧅: Tu asistente culinario y financiero. Planifica tus comidas semanales con IA, cocina guiado paso a paso y cotiza tu despensa en Walmart, Soriana, La Comer y Central de Abasto.">
  <meta name="keywords" content="recetas, cocina, planeador de comidas, cotizador de supermercados, despensa, chef ia, jitomate y cebolla">
  <meta name="author" content="Jitomate y Cebolla">

  <!-- Open Graph / Redes Sociales y WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.jitomateycebolla.com/">
  <meta property="og:title" content="Jitomate y Cebolla 🍅🧅 | No somos un recetario más">
  <meta property="og:description" content="«¡Olvídate de las típicas apps de cocina aburridas! Tu asistente culinario inteligente, wellness & fitness tracker.»">
  <meta property="og:image" content="https://www.jitomateycebolla.com/icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jitomate y Cebolla 🍅🧅 | No somos un recetario más">
  <meta name="twitter:description" content="«¡Olvídate de las apps aburridas! Asistente culinario inteligente, wellness & fitness tracker.»">
  <meta name="twitter:image" content="https://www.jitomateycebolla.com/icons/Icon-512.png">

  <!-- Colores del tema del navegador -->
  <meta name="theme-color" content="#D32F2F">
  <meta name="msapplication-navbutton-color" content="#D32F2F">
  <meta name="msapplication-TileColor" content="#D32F2F">

  <!-- iOS Safari meta tags & iconos PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jitomate y Cebolla">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jitomate y Cebolla 🍅🧅</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background-color: #121214;">
  <!-- Pantalla de Carga Instantánea para evitar pantallas negras en iPads y móviles -->
  <div id="splash-loader" style="
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    z-index: 999999;
    text-align: center;
    padding: 24px;
  ">
    <div style="position: relative; width: 92px; height: 92px; margin-bottom: 22px;">
      <img src="icons/Icon-192.png" alt="Jitomate y Cebolla" style="
        width: 92px; height: 92px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(211, 47, 47, 0.45);
      ">
    </div>
    <h1 style="font-size: 22px; font-weight: 700; margin: 0 0 6px 0; color: #f4f4f5; letter-spacing: -0.4px;">
      Jitomate y Cebolla 🍅🧅
    </h1>
    <p style="font-size: 13.5px; color: #a1a1aa; margin: 0 0 24px 0;">
      Preparando tu asistente culinario...
    </p>
    <div style="
      width: 32px;
      height: 32px;
      border: 3px solid rgba(211, 47, 47, 0.2);
      border-top-color: #e53935;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    "></div>
    <div id="splash-help" style="display: none; margin-top: 26px; max-width: 320px; font-size: 12px; color: #71717a; line-height: 1.4;">
      ¿Tarda en cargar? Si usas un iPad o navegador antiguo, asegúrate de no estar en navegación privada y tener Safari o Chrome actualizado.
    </div>
  </div>
  <style>
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Detección y auto-actualización del Service Worker ante nuevas versiones
    if ('serviceWorker' in navigator) {
      function activarNuevoWorker(reg) {
        if (!reg) return;
        if (reg.waiting) {
          reg.waiting.postMessage({type: 'SKIP_WAITING'});
        }
        reg.addEventListener('updatefound', function () {
          var newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function () {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[PWA] Activando nueva versión del Service Worker...');
                newWorker.postMessage({type: 'SKIP_WAITING'});
              }
            });
          }
        });
      }

      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var reg of registrations) {
          activarNuevoWorker(reg);
          reg.update();
        }
      });

      var recargando = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!recargando) {
          recargando = true;
          console.log('[PWA] Nueva versión desplegada detectada. Recargando automáticamente...');
          window.location.reload();
        }
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('splash-loader');
      if (loader) {
        loader.style.transition = 'opacity 0.4s ease';
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
        }, 400);
      }
    });
    setTimeout(function() {
      var help = document.getElementById('splash-help');
      if (help) help.style.display = 'block';
    }, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
