name: app_recetas
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
    
  # Herramientas del sistema
  cupertino_icons: ^1.0.8
  
  # Bases de datos y red
  supabase_flutter: ^2.17.2
  http: ^1.6.0
  
  # Inteligencia Artificial
  google_generative_ai: ^0.4.7
  
  # Utilidades de la app
  intl: ^0.20.3
  image_picker: ^1.2.3
  google_fonts: ^8.2.1
  
  # Herramientas actualizadas
  share_plus: ^13.3.0     
  url_launcher: ^6.3.1
  add_2_calendar: ^3.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Paquete oficial para generar los íconos de la app automáticamente
  flutter_launcher_icons: "^0.13.1"

# CONFIGURACIÓN DEL ÍCONO DE LA APLICACIÓN
flutter_launcher_icons:
  image_path: "assets/icon_nuevo.png"  # 👈 Pon aquí el nombre exacto del archivo nuevo que guardaste
  android: true
  ios: true
    
  # 💡 NUEVO: Fondo adaptativo para que el ícono abarque el tamaño completo en Android
  adaptive_icon_background: "#FFFFFF" 

flutter:
  uses-material-design: true

  # Sección de assets para lectura de recursos locales e imágenes
  assets:
    - assets/